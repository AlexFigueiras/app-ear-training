name: ear_training
description: "Neural Plasticity-Based Auditory Rehabilitation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  audio_session: ^0.2.4
  fl_chart: ^1.2.0
  get_it: ^9.2.1
  provider: ^6.1.2
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  pdf: ^3.13.0
  printing: ^5.15.0
  introduction_screen: ^4.0.0
  flutter_stripe: ^14.0.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/
