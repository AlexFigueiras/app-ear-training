name: ear_training
description: "BOSYN — app de treino auditivo (não é dispositivo médico)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Configuração (SUPABASE_URL / SUPABASE_ANON_KEY) entra em tempo de build:
#   flutter run --dart-define-from-file=.env
# Não há mais .env empacotado como asset (ver lib/core/app_config.dart e docs/DECISIONS.md).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audio_session: ^0.1.18
  fl_chart: ^0.68.0
  get_it: ^7.7.0
  provider: ^6.1.2
  supabase_flutter: ^2.13.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  ffi: ^2.2.0
  shared_preferences: ^2.5.5
  introduction_screen: ^4.0.0
  device_info_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Fonte única: o mesmo arquivo é exibido no app e publicado na web (URL da Play Console).
    - docs/legal/politica-de-privacidade.md
