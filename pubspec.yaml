name: ear_training
description: "Neural Plasticity-Based Auditory Rehabilitation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  audio_session: ^0.2.4
  fl_chart: ^1.2.0
  get_it: ^9.3.0
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  pdf: ^3.13.1
  printing: ^5.15.1
  introduction_screen: ^5.0.1
  flutter_stripe: ^14.1.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/
