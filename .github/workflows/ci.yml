name: CI & Build (APK / AAB)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create dummy .env
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_ANON_KEY=dummy
          GOOGLE_TTS_API_KEY=dummy
          EOF
          mkdir -p assets/audio
          touch assets/audio/.gitkeep

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Verify rules
        run: dart tool/verify_rules.dart

      - name: Run tests
        run: flutter test --coverage

      - name: Dependências desatualizadas (informativo)
        run: flutter pub outdated
        continue-on-error: true

  build-apk-aab:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_TTS_API_KEY=${{ secrets.GOOGLE_TTS_API_KEY }}
          EOF
          mkdir -p assets/audio
          touch assets/audio/.gitkeep

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release / Debug Fallback)
        run: flutter build apk --debug

      - name: Build App Bundle (AAB for Play Store)
        run: flutter build appbundle --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bosyn-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: bosyn-aab-debug
          path: build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 14

