name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Análise e testes não precisam de configuração: ela entra só no build, via
      # --dart-define-from-file (não há mais .env empacotado como asset).
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
        continue-on-error: true
        # NÃO endurecido para gate duro neste bootstrap: rodar `dart format` de verdade reformata
        # 29 dos 33 arquivos de lib/ hoje (whitespace apenas, mas é um diff que toca todo lib/,
        # fora do escopo "não tocar em lib/" deste bootstrap). Reformatar o repo é um item
        # follow-up isolado e explícito — ver docs/STATUS.md. Continua non-blocking até lá.

      - name: Analyze
        run: flutter analyze
        # Endurecido de propósito (sem --no-fatal-infos/--no-fatal-warnings): flutter analyze
        # JÁ encontrou 2 erros reais pré-existentes em lib/ui/screens/training_dashboard.dart e
        # test/widget_test.dart (não introduzidos por este bootstrap, não corrigidos aqui — ver
        # docs/STATUS.md). Erros de análise SEMPRE falham o comando, com ou sem essas flags —
        # removê-las não piora o estado atual, só para de mascarar warnings/infos futuros.

      # MESMA trava do hook local (.githooks/pre-commit) — nenhuma divergência entre trava
      # local e remota (módulo 11 do bootstrap adaptado, ver bootstrap/PLANO-VIABILIDADE-E-ADOCAO.md).
      - name: Verify rules (tamanho de arquivo, secrets em código-fonte)
        run: dart tool/verify_rules.dart

      - name: Run tests
        run: flutter test --coverage
        # Limiar de cobertura enforced: ainda não configurado (módulo 12 — suíte real é débito
        # registrado em docs/STATUS.md, não escrita neste bootstrap).

      - name: Dependências desatualizadas (informativo)
        run: flutter pub outdated
        continue-on-error: true
        # Não é um gate: pub não tem hoje um equivalente direto a `npm audit --audit-level=high`
        # / `pip-audit` / `cargo audit`. Limitação registrada em AGENTS.md (Stack Adapter) e
        # docs/DECISIONS.md — não inventamos um gate falso onde a ferramenta não existe.

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Só valores públicos (URL + chave publishable). A chave do Google TTS NÃO vem mais para o
      # app — mora nos secrets da Edge Function `tts` (supabase/functions/tts).
      # Sem os secrets configurados o APK abre na tela de "configuração inválida" (fail-fast).
      - name: Create .env
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=.env

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bosyn-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # APK de PROFILE: é o usado no checklist de escuta no celular. O debug roda em JIT e fica
      # lento, o que distorce tempo de resposta e fluidez do áudio durante os testes manuais.
      - name: Build profile APK
        run: flutter build apk --profile --dart-define-from-file=.env

      - name: Upload profile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bosyn-profile-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 14

  # Testes do motor nativo (cpp/) compilados no host com sanitizers: pegam estouro de memória,
  # comportamento indefinido e erros de DSP sem precisar de celular. Cada cpp/tests/*_test.cpp é
  # um executável independente (ver cpp/tests/check.h).
  native-tests:
    name: Native tests (C++ host, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run cpp/tests
        run: |
          set -e
          for test in cpp/tests/*_test.cpp; do
            echo "== $test"
            g++ -std=c++17 -O1 -g -Wall -Wextra \
              -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
              -Icpp -Icpp/tests -o /tmp/native_test "$test"
            /tmp/native_test
          done

  # Build de RELEASE descartável: prova que R8/minify, CMake/NDK e assinatura de fallback
  # funcionam, e trava o requisito de páginas de 16 KB da Google Play (apps com código nativo).
  # Este APK nunca é distribuído — o AAB da Play é gerado localmente com a chave de upload
  # (docs/PLAY_STORE.md). Sem android/key.properties o Gradle cai na chave debug aqui, de propósito.
  release-check:
    name: Release build (R8 + 16 KB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env (valores fictícios — só para compilar)
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_dummy
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (obfuscado)
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/debug-info
          --dart-define-from-file=.env

      - name: Verificar alinhamento de 16 KB (zip + ELF)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BUILD_TOOLS}zipalign" -c -P 16 4 "$APK"
          mkdir -p build/apk-libs
          unzip -q -o "$APK" 'lib/*' -d build/apk-libs
          dart tool/check_elf_alignment.dart build/apk-libs/lib
