name: 2 - Gerar AAB para a Play Store
# Monta o pacote do BOSYN para a Play Store (.aab), assinado com a chave de upload, na nuvem do
# GitHub. O número da versão sobe sozinho a cada execução: use sempre "Run workflow", nunca
# "Re-run" (o Re-run repete o número e a Play recusa). Passo a passo: docs/PLAY_STORE.md.
on:
  workflow_dispatch:
    inputs:
      anuncios:
        description: 'Anúncios desta versão (teste = teste interno/fechado; reais = produção)'
        type: choice
        options: [teste, reais]
        default: teste

permissions:
  contents: read

concurrency:
  group: gerar-aab
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Conferir a chave de upload
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos KEYSTORE_BASE64 e/ou KEYSTORE_PASSWORD."
            echo "❌ Falta a chave de upload: crie a chave e cadastre os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD (docs/PLAY_STORE.md, seção 3)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Aceita o texto com quebras de linha ou espaços (cópia do Windows ou do celular).
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
            echo "::error::O segredo KEYSTORE_BASE64 não é um texto base64 válido."
            echo "❌ O segredo KEYSTORE_BASE64 não é um texto base64 válido. Copie de novo TODO o conteúdo de KEYSTORE_BASE64.txt." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bash tool/play/preparar_chave.sh "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD"

      - name: Montar a configuração do app
        id: config
        env:
          ANUNCIOS: ${{ inputs.anuncios }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARD_ID: ${{ secrets.ADMOB_REWARD_ID }}
        run: bash tool/play/montar_env.sh

      - name: Número e nome da versão
        id: versao
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_OFFSET: ${{ vars.VERSION_OFFSET }}
        run: |
          NOME=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$NOME" ]; then
            echo "::error::Não achei a versão (version: x.y.z) no pubspec.yaml."
            exit 1
          fi
          CODIGO=$(( RUN_NUMBER + ${VERSION_OFFSET:-0} ))
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "Versão $NOME ($CODIGO)"

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar AAB
        env:
          NOME: ${{ steps.versao.outputs.nome }}
          CODIGO: ${{ steps.versao.outputs.codigo }}
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/debug-info
          --dart-define-from-file=.env
          --build-name="$NOME" --build-number="$CODIGO"

      - name: Conferir o AAB
        env:
          ADMOB_APP_ID: ${{ steps.config.outputs.admob_app_id }}
        run: bash tool/play/conferir_aab.sh build/app/outputs/bundle/release/app-release.aab "$ADMOB_APP_ID"

      - name: Separar o pacote e os símbolos
        env:
          ARQUIVO: bosyn-v${{ steps.versao.outputs.codigo }}-anuncios-${{ steps.config.outputs.modo }}
          MODO: ${{ steps.config.outputs.modo }}
          NOME: ${{ steps.versao.outputs.nome }}
          CODIGO: ${{ steps.versao.outputs.codigo }}
        run: |
          mkdir -p saida
          cp build/app/outputs/bundle/release/app-release.aab "saida/$ARQUIVO.aab"
          (cd build && zip -qr "../saida/$ARQUIVO-simbolos-dart.zip" debug-info)
          FLUTTER=$(flutter --version --machine | jq -r '.frameworkVersion')
          {
            if [ "$MODO" = "REAIS" ]; then
              echo "✅ **Anúncios REAIS** — versão $NOME ($CODIGO). Pode ir para a produção na Play Console."
            else
              echo "⚠️ **Anúncios de TESTE** — versão $NOME ($CODIGO). Use só em teste interno ou fechado."
            fi
            echo ""
            echo "📦 Baixe **$ARQUIVO** em Artifacts (no fim desta página) e descompacte para pegar o .aab."
            echo ""
            echo "🧩 Guarde também **$ARQUIVO-simbolos-dart**: sem ele não dá para ler os relatórios de erro desta versão."
            echo ""
            echo "Flutter $FLUTTER."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bosyn-v${{ steps.versao.outputs.codigo }}-anuncios-${{ steps.config.outputs.modo }}
          path: saida/*.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: bosyn-v${{ steps.versao.outputs.codigo }}-anuncios-${{ steps.config.outputs.modo }}-simbolos-dart
          path: saida/*-simbolos-dart.zip
          retention-days: 90

      - name: Apagar a chave da máquina
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks" .env
